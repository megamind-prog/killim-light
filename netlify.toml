[build]
  command = "npm run build"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/chief"
  to = "/chief.html"
  status = 200

[[redirects]]
  from = "/owner"
  to = "/owner.html"
  status = 200

[[redirects]]
  from = "/embed"
  to = "/embed.html"
  status = 200

[[redirects]]
  from = "/developers"
  to = "/developers.html"
  status = 200

# Other websites may show the map in a frame.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Security headers for every page and file.
# The Content-Security-Policy lives only here (not repeated per page): when several rules match a path, Netlify
# sends every matching value, and two CSP headers would both be enforced.
# Only our own scripts may run on our pages (blocks injected scripts from stealing logins).
# Netlify does NOT add these to function responses (/api/*, /img/*, /n/*): the functions set their own.
# The embeddable map (/embed) is the one page other websites may frame: netlify/edge-functions/embed-headers.ts
# gives it its own framing rules.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.maps.eox.at https://ibasemaps-api.arcgis.com; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()"

# The offline helper must always be checked for updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Owner page: never cached, never in search engines, never sends its address to other sites.
[[headers]]
  for = "/owner*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Team page.
[[headers]]
  for = "/chief*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/developers*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Login and owner scripts: always fetched fresh, so a security fix reaches every phone straight away.
[[headers]]
  for = "/assets/auth*.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/owner.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/osm/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
