<!doctype html>
<html lang="bi">
<head>
<meta charset="utf-8">
<script src="/assets/boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Killim Light · Nakamals Vanuatu</title>
<meta name="description" content="Live kava lights for nakamals in Vanuatu: see which nakamals have kava ready tonight, prices, ratings and directions.">
<meta name="theme-color" content="#5b4a2e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta property="og:type" content="website"><meta property="og:site_name" content="Killim Light">
<meta property="og:title" content="Killim Light: wanem nakamal i gat kava tunaet?"><meta property="og:description" content="Live kava lights for every nakamal in Vanuatu. See who has kava ready now, prices, ratings and the way there.">
<meta property="og:url" content="https://killim-light.netlify.app/">
<meta property="og:image" content="https://killim-light.netlify.app/assets/share-card.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/leaflet/leaflet.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="mappage">
<header class="topbar">
  <a href="/" class="brand"><img class="logo" src="/assets/icon.svg" alt=""><span>Killim Light</span></a>
  <nav class="topnav" aria-label="Main">
    <button class="tbtn" id="installBtn" type="button" hidden data-t="install">Install app</button>
    <button class="tbtn" type="button" id="langBtn">English</button>
    <a class="tbtn solid" href="/owner" data-t="forOwners">For owners</a>
  </nav>
</header>

<div class="shell">
  <aside class="side" id="sheet" data-state="peek" aria-label="Nakamals">
    <button class="grab" id="grab" type="button" aria-expanded="false" aria-controls="sheet"><span aria-hidden="true"></span><b class="sr" data-t="showList">Show the list</b></button>
    <div class="sidehead">
      <div class="banner" id="offlineBanner" hidden></div>
      <p class="kicker" data-t="tagline">Where is the kava ready tonight?</p>
      <h1 class="headline" id="headline" aria-live="polite">…</h1>
      <p class="subline" id="subline"></p>
      <button class="nearcta" type="button" id="nearCta" data-t="nearCta">📍 Find kava near me</button>
      <button class="sharetonight" type="button" id="shareTonight"><span aria-hidden="true">↗</span> <span data-t="shareTonight">Share tonight's lights</span></button>
      <div class="controls">
        <label class="selwrap"><span class="sr" data-t="island">Island</span><select class="field select" id="island" aria-label="Island"></select></label>
        <input class="field search" id="search" type="search" data-t-ph="search" aria-label="Search">
      </div>
      <div class="segrow">
        <div class="seg" role="group" aria-label="Filter">
          <button type="button" data-f="all" aria-pressed="true" data-t="f.all">All</button>
          <button type="button" data-f="green" aria-pressed="false" class="l-green"><span class="dot"></span><span data-t="ls.green">Kava ready</span></button>
          <button type="button" data-f="fav" aria-pressed="false" data-t="f.fav">★ Favourites</button>
          <button type="button" data-f="specials" aria-pressed="false" data-t="f.specials">📣 Specials</button>
        </div>
        <button class="morebtn" type="button" id="moreBtn" aria-expanded="false" aria-controls="morePanel"><span data-t="moreFilters">Filters</span> <b id="moreCount" hidden></b></button>
      </div>
    </div>
    <div class="morepanel" id="morePanel" hidden>
      <label for="sort"><span data-t="sortLabel">Sort</span><select class="field" id="sort">
          <option value="status" data-t="sort.status">Open first</option><option value="near" data-t="sort.near">Nearest to me</option>
          <option value="rating" data-t="sort.rating">Top rated</option><option value="name" data-t="sort.name">Name</option></select></label>
      <div class="row">
        <label for="fPrice"><span data-t="fPrice">Shell price up to</span><select class="field" id="fPrice"><option value="" data-t="any">Any</option><option value="100">100 vt</option><option value="150">150 vt</option><option value="200">200 vt</option></select></label>
        <label for="fFrom"><span data-t="kavaFromLabel">Kava from</span><select class="field" id="fFrom"><option value="" data-t="any">Any</option></select></label>
        <label for="fStr"><span data-t="strength">Strength</span><select class="field" id="fStr"><option value="" data-t="any">Any</option><option value="mild" data-t="st.mild">Mild</option><option value="medium" data-t="st.medium">Medium</option><option value="strong" data-t="st.strong">Strong</option></select></label>
      </div>
      <label class="check" for="fLate"><input type="checkbox" id="fLate"><span data-t="fLate">Open late (after 11 pm)</span></label>
      <div class="row-btns"><button class="link" type="button" id="fClear" data-t="fClear">Clear filters</button></div>
    </div>
    <div class="areabox" id="areaBox"></div>
    <div class="list" id="list" aria-live="polite"><div class="empty" data-t="loading">Loading…</div></div>
    <footer class="foot">
      <p><span data-t="ownerLink">Run a nakamal?</span> <a class="link" href="/owner" data-t="ownerLogin">Owner login</a></p>
      <p class="footlinks"><a href="/developers" data-t="devLink">Developers &amp; open data</a> · <a href="/privacy" data-t="privacy">Privacy</a> · <a href="/terms" data-t="terms">Terms</a></p>
      <p class="footlinks" data-t="mapAttrib" data-tv='{"osm":"<a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">OpenStreetMap contributors</a>"}'>Map data © OpenStreetMap contributors</p>
    </footer>
  </aside>

  <section class="mapwrap" aria-label="Map">
    <div class="map" id="map" role="region" aria-label="Map of Vanuatu with nakamals"></div>
    <div class="zoomhint" id="zoomHint" hidden data-t="zoomHint">Zoom in to see tonight's kava lights</div>
    <button class="mapbtn" type="button" id="locBtn" data-t="nearMe">📍 Near me</button>
    <div class="routecard" id="routeCard" hidden aria-live="polite"></div>
    <div class="maplegend" aria-label="Legend">
      <span class="l-green"><span class="dot"></span><span data-t="ls.green">Kava ready</span></span>
      <span class="l-amber"><span class="dot"></span><span data-t="ls.amber">Low</span></span>
      <span class="l-closed"><span class="dot">✕</span><span data-t="ls.closed">Closed</span></span>
      <span class="l-stale"><span class="dot"></span><span data-t="ls.stale">No update</span></span>
    </div>
  </section>
</div>

<script src="/assets/leaflet/leaflet.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/route.js"></script>
<script src="/assets/public.js"></script>
</body>
</html>
